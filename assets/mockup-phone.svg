<svg xmlns="http://www.w3.org/2000/svg" width="320" height="640" viewBox="0 0 320 640" font-family="'Segoe UI',Inter,Arial,sans-serif">
  <defs>
    <clipPath id="screen"><rect x="18" y="18" width="284" height="604" rx="30"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- marco -->
  <rect x="4" y="4" width="312" height="632" rx="42" fill="#0d1117" stroke="#00FFB3" stroke-width="2" filter="url(#sh)"/>
  <rect x="12" y="12" width="296" height="616" rx="36" fill="#1a1f26"/>
  <rect x="18" y="18" width="284" height="604" rx="30" fill="#FAF3F3"/>
  <!-- notch -->
  <rect x="110" y="24" width="100" height="22" rx="11" fill="#0d1117"/>

  <g clip-path="url(#screen)">
    <!-- cabecera app -->
    <text x="160" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#0E0E0E" letter-spacing="2">NAILS EXPRESS</text>
    <text x="160" y="94" text-anchor="middle" font-size="9" fill="#E8707A" letter-spacing="1.5">MANOS QUE HABLAN DE TI</text>

    <!-- stepper -->
    <g>
      <line x1="60" y1="118" x2="260" y2="118" stroke="#E6DADA" stroke-width="2"/>
      <circle cx="60" cy="118" r="8" fill="#5CC6BF"/><text x="60" y="122" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">✓</text>
      <circle cx="126" cy="118" r="8" fill="#5CC6BF"/><text x="126" y="122" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">2</text>
      <circle cx="193" cy="118" r="8" fill="#fff" stroke="#E6DADA" stroke-width="2"/><text x="193" y="122" text-anchor="middle" font-size="9" fill="#999">3</text>
      <circle cx="260" cy="118" r="8" fill="#fff" stroke="#E6DADA" stroke-width="2"/><text x="260" y="122" text-anchor="middle" font-size="9" fill="#999">4</text>
      <circle cx="126" cy="118" r="12" fill="none" stroke="#5CC6BF" stroke-width="2" opacity="0.6"><animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <text x="160" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#0E0E0E">Elige fecha y hora</text>

    <!-- calendario -->
    <rect x="34" y="160" width="252" height="150" rx="14" fill="#fff" stroke="#F1E4E4"/>
    <text x="160" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#0E0E0E">Octubre 2026</text>
    <g font-size="8" fill="#999" text-anchor="middle">
      <text x="56" y="200">L</text><text x="90" y="200">M</text><text x="124" y="200">M</text><text x="158" y="200">J</text><text x="192" y="200">V</text><text x="226" y="200">S</text><text x="260" y="200">D</text>
    </g>
    <g font-size="9" fill="#444" text-anchor="middle">
      <text x="56" y="222">5</text><text x="90" y="222">6</text><text x="124" y="222">7</text><text x="158" y="222">8</text><text x="192" y="222">9</text><text x="226" y="222">10</text><text x="260" y="222" fill="#ccc">11</text>
      <text x="56" y="248">12</text><text x="90" y="248">13</text><text x="124" y="248">14</text>
      <circle cx="158" cy="245" r="11" fill="#5CC6BF"/><text x="158" y="248" fill="#fff" font-weight="700">15</text>
      <text x="192" y="248">16</text><text x="226" y="248">17</text><text x="260" y="248" fill="#ccc">18</text>
      <text x="56" y="274">19</text><text x="90" y="274">20</text><text x="124" y="274">21</text><text x="158" y="274">22</text><text x="192" y="274">23</text><text x="226" y="274">24</text><text x="260" y="274" fill="#ccc">25</text>
      <text x="56" y="300">26</text><text x="90" y="300">27</text><text x="124" y="300">28</text><text x="158" y="300">29</text><text x="192" y="300">30</text><text x="226" y="300">31</text>
    </g>

    <!-- horarios -->
    <text x="34" y="334" font-size="10" fill="#666">Horarios libres · tiempo real</text>
    <g font-size="10" text-anchor="middle">
      <!-- fila 1 -->
      <rect x="34" y="344" width="76" height="28" rx="14" fill="#fff" stroke="#E6DADA"/><text x="72" y="362" fill="#444">09:00</text>
      <rect x="122" y="344" width="76" height="28" rx="14" fill="#fff" stroke="#E6DADA"/><text x="160" y="362" fill="#444">10:30</text>
      <rect x="210" y="344" width="76" height="28" rx="14" fill="#F3F3F3" stroke="#eee"/><text x="248" y="362" fill="#bbb" text-decoration="line-through">12:00</text>
      <!-- fila 2 -->
      <rect x="34" y="382" width="76" height="28" rx="14" fill="#fff" stroke="#E6DADA"/><text x="72" y="400" fill="#444">14:00</text>
      <rect x="122" y="382" width="76" height="28" rx="14" fill="#5CC6BF">
        <animate attributeName="fill" values="#5CC6BF;#5CC6BF;#fff;#fff;#5CC6BF" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="160" y="400" fill="#fff" font-weight="700">15:30<animate attributeName="fill" values="#fff;#fff;#444;#444;#fff" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/></text>
      <rect x="210" y="382" width="76" height="28" rx="14" fill="#fff">
        <animate attributeName="fill" values="#fff;#fff;#5CC6BF;#5CC6BF;#fff" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#E6DADA;#E6DADA;#5CC6BF;#5CC6BF;#E6DADA" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="248" y="400" fill="#444">17:00<animate attributeName="fill" values="#444;#444;#fff;#fff;#444" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/></text>
      <!-- fila 3 -->
      <rect x="34" y="420" width="76" height="28" rx="14" fill="#fff" stroke="#E6DADA"/><text x="72" y="438" fill="#444">18:30</text>
      <rect x="122" y="420" width="76" height="28" rx="14" fill="#F3F3F3" stroke="#eee"/><text x="160" y="438" fill="#bbb" text-decoration="line-through">19:00</text>
      <rect x="210" y="420" width="76" height="28" rx="14" fill="#fff" stroke="#E6DADA"/><text x="248" y="438" fill="#444">19:30</text>
    </g>

    <!-- resumen -->
    <rect x="34" y="462" width="252" height="52" rx="12" fill="#FBEDED"/>
    <text x="48" y="482" font-size="9" fill="#999">Manicure Gel · 60 min</text>
    <text x="48" y="500" font-size="11" font-weight="700" fill="#0E0E0E">Jue 15 Oct · 15:30</text>
    <text x="272" y="500" text-anchor="end" font-size="12" font-weight="700" fill="#E8707A">S/ 45</text>

    <!-- boton -->
    <rect x="34" y="530" width="252" height="40" rx="20" fill="#5CC6BF">
      <animate attributeName="opacity" values="1;0.82;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <text x="160" y="555" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Reservar ahora →</text>

    <text x="160" y="598" text-anchor="middle" font-size="8" fill="#999">🔒 cero cruce de horarios · confirmación por WhatsApp</text>
  </g>
</svg>
