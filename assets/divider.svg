<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FFB3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00FFB3" stop-opacity="1"/>
      <stop offset="1" stop-color="#00FFB3" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="0" y1="12" x2="1000" y2="12" stroke="#00FFB3" stroke-opacity="0.25" stroke-width="2"/>
  <rect x="-260" y="10" width="260" height="4" rx="2" fill="url(#pulse)" filter="url(#glow)">
    <animate attributeName="x" from="-260" to="1000" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="500" cy="12" r="4" fill="#00FFB3">
    <animate attributeName="r" values="3;5;3" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
