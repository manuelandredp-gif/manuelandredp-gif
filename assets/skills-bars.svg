<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="'Fira Code','JetBrains Mono','Cascadia Code',Consolas,monospace">
  <defs>
    <filter id="gl" x="-5%" y="-50%" width="110%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00805a"/>
      <stop offset="1" stop-color="#00FFB3"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="track"><rect x="250" y="56" width="640" height="290"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="359" rx="14" fill="#0d1117" stroke="#00FFB3" stroke-width="1.5"/>
  <text x="24" y="34" font-size="15" fill="#00FFB3" font-weight="700">~/skills $ cat nivel.txt</text>
  <text x="976" y="34" font-size="12" fill="#8b949e" text-anchor="end"># autoevaluación honesta · se actualiza con cada proyecto</text>

  <g font-size="14">
    <!-- fila 1 -->
    <text x="24" y="76" fill="#c9d1d9">Python</text><text x="236" y="76" fill="#8b949e" text-anchor="end">♥</text>
    <rect x="250" y="64" width="640" height="14" rx="7" fill="#0a1f19"/>
    <rect x="250" y="64" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#gl)"><animate attributeName="width" from="0" to="544" dur="1.2s" begin="0.2s" fill="freeze"/></rect>
    <text x="906" y="76" fill="#00FFB3" opacity="0">85%<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/></text>

    <text x="24" y="106" fill="#c9d1d9">JavaScript / TypeScript</text>
    <rect x="250" y="94" width="640" height="14" rx="7" fill="#0a1f19"/>
    <rect x="250" y="94" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#gl)"><animate attributeName="width" from="0" to="480" dur="1.2s" begin="0.35s" fill="freeze"/></rect>
    <text x="906" y="106" fill="#00FFB3" opacity="0">75%<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.35s" fill="freeze"/></text>

    <text x="24" y="136" fill="#c9d1d9">React / Next.js</text>
    <rect x="250" y="124" width="640" height="14" rx="7" fill="#0a1f19"/>
    <rect x="250" y="124" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#gl)"><animate attributeName="width" from="0" to="448" dur="1.2s" begin="0.5s" fill="freeze"/></rect>
    <text x="906" y="136" fill="#00FFB3" opacity="0">70%<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze"/></text>

    <text x="24" y="166" fill="#c9d1d9">SQL · PostgreSQL / MySQL</text>
    <rect x="250" y="154" width="640" height="14" rx="7" fill="#0a1f19"/>
    <rect x="250" y="154" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#gl)"><animate attributeName="width" from="0" to="448" dur="1.2s" begin="0.65s" fill="freeze"/></rect>
    <text x="906" y="166" fill="#00FFB3" opacity="0">70%<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.65s" fill="freeze"/></text>

    <text x="24" y="196" fill="#c9d1d9">Node.js / APIs REST</text>
    <rect x="250" y="184" width="640" height="14" rx="7" fill="#0a1f19"/>
    <rect x="250" y="184" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#gl)"><animate attributeName="width" from="0" to="416" dur="1.2s" begin="0.8s" fill="freeze"/></rect>
    <text x="906" y="196" fill="#00FFB3" opacity="0">65%<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.8s" fill="freeze"/></text>

    <text x="24" y="226" fill="#c9d1d9">Linux / Bash</text><text x="236" y="226" fill="#febc2e" text-anchor="end" font-size="11">↑</text>
    <rect x="250" y="214" width="640" height="14" rx="7" fill="#0a1f19"/>
    <rect x="250" y="214" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#gl)"><animate attributeName="width" from="0" to="384" dur="1.2s" begin="0.95s" fill="freeze"/></rect>
    <text x="906" y="226" fill="#00FFB3" opacity="0">60%<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.95s" fill="freeze"/></text>

    <text x="24" y="256" fill="#c9d1d9">Java / Spring Boot</text>
    <rect x="250" y="244" width="640" height="14" rx="7" fill="#0a1f19"/>
    <rect x="250" y="244" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#gl)"><animate attributeName="width" from="0" to="352" dur="1.2s" begin="1.1s" fill="freeze"/></rect>
    <text x="906" y="256" fill="#00FFB3" opacity="0">55%<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.1s" fill="freeze"/></text>

    <text x="24" y="286" fill="#c9d1d9">Docker</text><text x="236" y="286" fill="#febc2e" text-anchor="end" font-size="11">↑</text>
    <rect x="250" y="274" width="640" height="14" rx="7" fill="#0a1f19"/>
    <rect x="250" y="274" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#gl)"><animate attributeName="width" from="0" to="288" dur="1.2s" begin="1.25s" fill="freeze"/></rect>
    <text x="906" y="286" fill="#00FFB3" opacity="0">45%<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.25s" fill="freeze"/></text>

    <text x="24" y="316" fill="#c9d1d9">DevOps / CI-CD</text><text x="236" y="316" fill="#febc2e" text-anchor="end" font-size="11">↑</text>
    <rect x="250" y="304" width="640" height="14" rx="7" fill="#0a1f19"/>
    <rect x="250" y="304" width="0" height="14" rx="7" fill="url(#bar)" filter="url(#gl)"><animate attributeName="width" from="0" to="224" dur="1.2s" begin="1.4s" fill="freeze"/></rect>
    <text x="906" y="316" fill="#00FFB3" opacity="0">35%<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.4s" fill="freeze"/></text>
  </g>

  <!-- brillo que recorre las barras -->
  <g clip-path="url(#track)">
    <rect x="-200" y="56" width="160" height="290" fill="url(#shine)" opacity="0.9">
      <animate attributeName="x" from="-200" to="900" dur="3.2s" begin="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="24" y="346" font-size="11" fill="#8b949e">↑ = en lo que estoy invirtiendo tiempo ahora mismo</text>
</svg>
