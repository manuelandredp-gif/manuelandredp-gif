<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" font-family="'Fira Code','JetBrains Mono',Consolas,monospace">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="150" rx="18" fill="#0d1117"/>
  <!-- ondas -->
  <path fill="#00FFB3" fill-opacity="0.12" d="M0 70 C 150 20, 300 120, 500 70 S 850 20, 1000 70 V150 H0 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0 70 C 150 20, 300 120, 500 70 S 850 20, 1000 70 V150 H0 Z;
              M0 70 C 150 120, 300 20, 500 70 S 850 120, 1000 70 V150 H0 Z;
              M0 70 C 150 20, 300 120, 500 70 S 850 20, 1000 70 V150 H0 Z"/>
  </path>
  <path fill="none" stroke="#00FFB3" stroke-width="2.5" filter="url(#glow)" d="M0 70 C 150 20, 300 120, 500 70 S 850 20, 1000 70">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0 70 C 150 20, 300 120, 500 70 S 850 20, 1000 70;
              M0 70 C 150 120, 300 20, 500 70 S 850 120, 1000 70;
              M0 70 C 150 20, 300 120, 500 70 S 850 20, 1000 70"/>
  </path>
  <text x="500" y="120" text-anchor="middle" font-size="14" fill="#00FFB3" fill-opacity="0.85">&lt;/&gt; hecho con Python, bash y café · Tacna, Perú</text>
</svg>
