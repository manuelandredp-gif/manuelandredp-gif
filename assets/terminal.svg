  <!-- ventana -->
  <rect x="0.5" y="0.5" width="999" height="469" rx="14" fill="#000000" stroke="#00FFB3" stroke-width="1.5"/>
  <rect x="0.5" y="0.5" width="999" height="40" rx="14" fill="#0a0f0d"/>
  <rect x="0.5" y="26" width="999" height="15" fill="#0a0f0d"/>
  <line x1="0.5" y1="41" x2="999.5" y2="41" stroke="#00FFB3" stroke-opacity="0.35"/>
  <circle cx="24" cy="21" r="6.5" fill="#ff5f57"/>
  <circle cx="46" cy="21" r="6.5" fill="#febc2e"/>
  <circle cx="68" cy="21" r="6.5" fill="#00FFB3"/>
  <text x="500" y="26" text-anchor="middle" font-size="13" fill="#8b949e">manuel@tacna: ~ — bash</text>

  <!-- línea 1 -->
  <g clip-path="url(#c1)">
    <text x="24" y="76"><tspan fill="#00FFB3">manuel@tacna</tspan><tspan fill="#fff">:</tspan><tspan fill="#5ea0ff">~</tspan><tspan fill="#fff">$ </tspan><tspan fill="#fff">whoami</tspan></text>
  </g>
  <g clip-path="url(#c2)">
    <text x="24" y="100" fill="#c9d1d9">Manuel Andree Dongo Palza</text>
  </g>

  <!-- línea neofetch -->
  <g clip-path="url(#c3)">
    <text x="24" y="138"><tspan fill="#00FFB3">manuel@tacna</tspan><tspan fill="#fff">:</tspan><tspan fill="#5ea0ff">~</tspan><tspan fill="#fff">$ </tspan><tspan fill="#fff">neofetch</tspan></text>
  </g>

  <!-- logo ascii (tux minimal) -->
  <g clip-path="url(#c4)" fill="#00FFB3" filter="url(#g)" font-size="15">
    <text x="30" y="172">   .--.</text>
    <text x="30" y="190">  |o_o |</text>
    <text x="30" y="208">  |:_/ |</text>
    <text x="30" y="226"> //   \ \</text>
    <text x="30" y="244">(|     | )</text>
    <text x="30" y="262">/'\_   _/`\</text>
    <text x="30" y="280">\___)=(___/</text>
  </g>

