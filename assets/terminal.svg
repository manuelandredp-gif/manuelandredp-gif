    <g clip-path="url(#c4)"><text x="240" y="172"><tspan fill="#00FFB3" font-weight="700">manuel</tspan><tspan fill="#fff">@</tspan><tspan fill="#00FFB3" font-weight="700">tacna</tspan></text></g>
    <g clip-path="url(#c4)"><text x="240" y="190" fill="#00FFB3">──────────────────────────────</text></g>
    <g clip-path="url(#c5)"><text x="240" y="208"><tspan fill="#00FFB3" font-weight="700">Rol</tspan><tspan fill="#c9d1d9">: Estudiante de Ing. de Sistemas · últimos ciclos</tspan></text></g>
    <g clip-path="url(#c6)"><text x="240" y="226"><tspan fill="#00FFB3" font-weight="700">Build</tspan><tspan fill="#c9d1d9">: aplicativos web · landing pages · paneles admin</tspan></text></g>
    <g clip-path="url(#c7)"><text x="240" y="244"><tspan fill="#00FFB3" font-weight="700">Lang</tspan><tspan fill="#c9d1d9">: Python ♥ · JavaScript · SQL · Bash</tspan></text></g>
    <g clip-path="url(#c8)"><text x="240" y="262"><tspan fill="#00FFB3" font-weight="700">OS</tspan><tspan fill="#c9d1d9">: Linux (en pleno aprendizaje, sin miedo a la terminal)</tspan></text></g>
    <g clip-path="url(#c9)"><text x="240" y="280"><tspan fill="#00FFB3" font-weight="700">Tools</tspan><tspan fill="#c9d1d9">: Git · Docker · VS Code · React · Node · Flask</tspan></text></g>
    <g clip-path="url(#c10)"><text x="240" y="298"><tspan fill="#00FFB3" font-weight="700">Location</tspan><tspan fill="#c9d1d9">: Tacna, Perú 🇵🇪</tspan></text></g>
    <g clip-path="url(#c10)"><text x="240" y="316"><tspan fill="#00FFB3" font-weight="700">Uptime</tspan><tspan fill="#c9d1d9">: debuggeando desde el primer "hola mundo"</tspan></text></g>
    <!-- paleta -->
    <g clip-path="url(#c10)">
      <rect x="240" y="330" width="22" height="12" fill="#000" stroke="#333"/>
      <rect x="264" y="330" width="22" height="12" fill="#003d2b"/>
      <rect x="288" y="330" width="22" height="12" fill="#00805a"/>
      <rect x="312" y="330" width="22" height="12" fill="#00b37d"/>
      <rect x="336" y="330" width="22" height="12" fill="#00FFB3"/>
      <rect x="360" y="330" width="22" height="12" fill="#7fffd9"/>
      <rect x="384" y="330" width="22" height="12" fill="#c9d1d9"/>
      <rect x="408" y="330" width="22" height="12" fill="#ffffff"/>
    </g>
  </g>

  <!-- python -->
  <g clip-path="url(#c11)">
    <text x="24" y="382"><tspan fill="#00FFB3">manuel@tacna</tspan><tspan fill="#fff">:</tspan><tspan fill="#5ea0ff">~</tspan><tspan fill="#fff">$ </tspan><tspan fill="#fff">python3 -c </tspan><tspan fill="#ffd866">"print('construyendo cosas que la gente usa')"</tspan></text>
  </g>
  <g clip-path="url(#c12)">
    <text x="24" y="408" fill="#c9d1d9">construyendo cosas que la gente usa</text>
  </g>

  <!-- prompt final + cursor -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="6.8s" fill="freeze"/>
    <text x="24" y="444"><tspan fill="#00FFB3">manuel@tacna</tspan><tspan fill="#fff">:</tspan><tspan fill="#5ea0ff">~</tspan><tspan fill="#fff">$ </tspan></text>
    <rect x="176" y="430" width="10" height="18" fill="#00FFB3">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
