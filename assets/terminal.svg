<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="'Fira Code','JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="16">
  <defs>
    <filter id="g" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- un clipPath por línea: efecto de tipeo -->
    <clipPath id="c1"><rect x="0" y="0" width="0" height="470"><animate attributeName="width" from="0" to="1000" dur="0.6s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="0" width="0" height="470"><animate attributeName="width" from="0" to="1000" dur="0.3s" begin="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="0" width="0" height="470"><animate attributeName="width" from="0" to="1000" dur="0.6s" begin="1.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="0" y="0" width="0" height="470"><animate attributeName="width" from="0" to="1000" dur="0.5s" begin="2.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="0" y="0" width="0" height="470"><animate attributeName="width" from="0" to="1000" dur="0.5s" begin="2.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="0" y="0" width="0" height="470"><animate attributeName="width" from="0" to="1000" dur="0.5s" begin="3.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c7"><rect x="0" y="0" width="0" height="470"><animate attributeName="width" from="0" to="1000" dur="0.5s" begin="3.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c8"><rect x="0" y="0" width="0" height="470"><animate attributeName="width" from="0" to="1000" dur="0.5s" begin="3.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c9"><rect x="0" y="0" width="0" height="470"><animate attributeName="width" from="0" to="1000" dur="0.5s" begin="4.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="c10"><rect x="0" y="0" width="0" height="470"><animate attributeName="width" from="0" to="1000" dur="0.5s" begin="4.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="c11"><rect x="0" y="0" width="0" height="470"><animate attributeName="width" from="0" to="1000" dur="0.9s" begin="5.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c12"><rect x="0" y="0" width="0" height="470"><animate attributeName="width" from="0" to="1000" dur="0.3s" begin="6.3s" fill="freeze"/></rect></clipPath>
