<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="'Fira Code','JetBrains Mono','Cascadia Code',Consolas,monospace">
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00FFB3" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FFB3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00FFB3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00FFB3" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipHeader"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <!-- fondo -->
  <rect width="1000" height="300" rx="18" fill="#0d1117"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>

  <!-- matrix rain -->
  <g font-family="monospace" font-size="14" fill="#00FFB3" opacity="0.45" clip-path="url(#clipHeader)">
    <g transform="translate(24,-120)"><animateTransform attributeName="transform" type="translate" values="24,-120;24,320" dur="5.1s" begin="3.4s" repeatCount="indefinite"/><text y="0" fill-opacity="0.08">&lt;</text><text y="18" fill-opacity="0.17">}</text><text y="36" fill-opacity="0.26">0</text><text y="54" fill-opacity="0.35">}</text><text y="72" fill-opacity="0.44">;</text><text y="90" fill-opacity="1" fill="#7fffd9">;</text></g>
    <g transform="translate(86,-120)"><animateTransform attributeName="transform" type="translate" values="86,-120;86,320" dur="6.9s" begin="1.5s" repeatCount="indefinite"/><text y="0" fill-opacity="0.08">&gt;</text><text y="18" fill-opacity="0.17">+</text><text y="36" fill-opacity="0.26">+</text><text y="54" fill-opacity="0.35">#</text><text y="72" fill-opacity="0.44">1</text><text y="90" fill-opacity="1" fill="#7fffd9">λ</text></g>
    <g transform="translate(148,-120)"><animateTransform attributeName="transform" type="translate" values="148,-120;148,320" dur="7.6s" begin="1.8s" repeatCount="indefinite"/><text y="0" fill-opacity="0.08">#</text><text y="18" fill-opacity="0.17">/</text><text y="36" fill-opacity="0.26">+</text><text y="54" fill-opacity="0.35">/</text><text y="72" fill-opacity="0.44">$</text><text y="90" fill-opacity="1" fill="#7fffd9">/</text></g>
    <g transform="translate(210,-120)"><animateTransform attributeName="transform" type="translate" values="210,-120;210,320" dur="5.4s" begin="3.3s" repeatCount="indefinite"/><text y="0" fill-opacity="0.08">1</text><text y="18" fill-opacity="0.17">&lt;</text><text y="36" fill-opacity="0.26">#</text><text y="54" fill-opacity="0.35">&gt;</text><text y="72" fill-opacity="0.44">#</text><text y="90" fill-opacity="0.53">=</text><text y="108" fill-opacity="0.62">/</text><text y="126" fill-opacity="1" fill="#7fffd9">;</text></g>
    <g transform="translate(272,-120)"><animateTransform attributeName="transform" type="translate" values="272,-120;272,320" dur="4.7s" begin="3.0s" repeatCount="indefinite"/><text y="0" fill-opacity="0.08">=</text><text y="18" fill-opacity="0.17">$</text><text y="36" fill-opacity="0.26">*</text><text y="54" fill-opacity="0.35">/</text><text y="72" fill-opacity="0.44">$</text><text y="90" fill-opacity="0.53">+</text><text y="108" fill-opacity="0.62">0</text><text y="126" fill-opacity="1" fill="#7fffd9">#</text></g>
    <g transform="translate(334,-120)"><animateTransform attributeName="transform" type="translate" values="334,-120;334,320" dur="7.0s" begin="0.7s" repeatCount="indefinite"/><text y="0" fill-opacity="0.08">;</text><text y="18" fill-opacity="0.17">/</text><text y="36" fill-opacity="0.26">*</text><text y="54" fill-opacity="0.35">&lt;</text><text y="72" fill-opacity="0.44">=</text><text y="90" fill-opacity="0.53">+</text><text y="108" fill-opacity="1" fill="#7fffd9">=</text></g>
    <g transform="translate(396,-120)"><animateTransform attributeName="transform" type="translate" values="396,-120;396,320" dur="5.5s" begin="0.5s" repeatCount="indefinite"/><text y="0" fill-opacity="0.08">+</text><text y="18" fill-opacity="0.17">=</text><text y="36" fill-opacity="0.26">#</text><text y="54" fill-opacity="0.35">+</text><text y="72" fill-opacity="1" fill="#7fffd9">{</text></g>
    <g transform="translate(458,-120)"><animateTransform attributeName="transform" type="translate" values="458,-120;458,320" dur="6.1s" begin="1.5s" repeatCount="indefinite"/><text y="0" fill-opacity="0.08">$</text><text y="18" fill-opacity="0.17">#</text><text y="36" fill-opacity="0.26">;</text><text y="54" fill-opacity="0.35">{</text><text y="72" fill-opacity="0.44">{</text><text y="90" fill-opacity="0.53">+</text><text y="108" fill-opacity="1" fill="#7fffd9">}</text></g>
    <g transform="translate(520,-120)"><animateTransform attributeName="transform" type="translate" values="520,-120;520,320" dur="8.0s" begin="2.2s" repeatCount="indefinite"/><text y="0" fill-opacity="0.08">0</text><text y="18" fill-opacity="0.17">λ</text><text y="36" fill-opacity="0.26">;</text><text y="54" fill-opacity="0.35">{</text><text y="72" fill-opacity="1" fill="#7fffd9">}</text></g>
    <g transform="translate(582,-120)"><animateTransform attributeName="transform" type="translate" values="582,-120;582,320" dur="4.5s" begin="1.7s" repeatCount="indefinite"/><text y="0" fill-opacity="0.08">&gt;</text><text y="18" fill-opacity="0.17">&lt;</text><text y="36" fill-opacity="0.26">=</text><text y="54" fill-opacity="0.35">;</text><text y="72" fill-opacity="0.44">/</text><text y="90" fill-opacity="0.53">#</text><text y="108" fill-opacity="0.62">/</text><text y="126" fill-opacity="1" fill="#7fffd9">{</text></g>
    <g transform="translate(644,-120)"><animateTransform attributeName="transform" type="translate" values="644,-120;644,320" dur="7.9s" begin="1.3s" repeatCount="indefinite"/><text y="0" fill-opacity="0.08">{</text><text y="18" fill-opacity="0.17">*</text><text y="36" fill-opacity="0.26">&gt;</text><text y="54" fill-opacity="0.35">}</text><text y="72" fill-opacity="1" fill="#7fffd9">$</text></g>
    <g transform="translate(706,-120)"><animateTransform attributeName="transform" type="translate" values="706,-120;706,320" dur="4.9s" begin="2.9s" repeatCount="indefinite"/><text y="0" fill-opacity="0.08">+</text><text y="18" fill-opacity="0.17">0</text><text y="36" fill-opacity="0.26">$</text><text y="54" fill-opacity="0.35">+</text><text y="72" fill-opacity="0.44">λ</text><text y="90" fill-opacity="0.53">#</text><text y="108" fill-opacity="0.62">&gt;</text><text y="126" fill-opacity="1" fill="#7fffd9">&lt;</text></g>
    <g transform="translate(768,-120)"><animateTransform attributeName="transform" type="translate" values="768,-120;768,320" dur="8.3s" begin="0.3s" repeatCount="indefinite"/><text y="0" fill-opacity="0.08">=</text><text y="18" fill-opacity="0.17">&gt;</text><text y="36" fill-opacity="0.26">λ</text><text y="54" fill-opacity="0.35">1</text><text y="72" fill-opacity="0.44">/</text><text y="90" fill-opacity="0.53">λ</text><text y="108" fill-opacity="0.62">#</text><text y="126" fill-opacity="1" fill="#7fffd9">#</text></g>
    <g transform="translate(830,-120)"><animateTransform attributeName="transform" type="translate" values="830,-120;830,320" dur="6.6s" begin="2.9s" repeatCount="indefinite"/><text y="0" fill-opacity="0.08">{</text><text y="18" fill-opacity="0.17">0</text><text y="36" fill-opacity="0.26">λ</text><text y="54" fill-opacity="0.35">;</text><text y="72" fill-opacity="0.44">+</text><text y="90" fill-opacity="1" fill="#7fffd9">{</text></g>
    <g transform="translate(892,-120)"><animateTransform attributeName="transform" type="translate" values="892,-120;892,320" dur="6.6s" begin="1.8s" repeatCount="indefinite"/><text y="0" fill-opacity="0.08">}</text><text y="18" fill-opacity="0.17">#</text><text y="36" fill-opacity="0.26">+</text><text y="54" fill-opacity="0.35">$</text><text y="72" fill-opacity="1" fill="#7fffd9">$</text></g>
    <g transform="translate(954,-120)"><animateTransform attributeName="transform" type="translate" values="954,-120;954,320" dur="5.9s" begin="0.8s" repeatCount="indefinite"/><text y="0" fill-opacity="0.08">0</text><text y="18" fill-opacity="0.17">{</text><text y="36" fill-opacity="0.26">+</text><text y="54" fill-opacity="0.35">*</text><text y="72" fill-opacity="0.44">0</text><text y="90" fill-opacity="0.53">;</text><text y="108" fill-opacity="1" fill="#7fffd9">$</text></g>
  </g>

  <rect width="1000" height="120" fill="url(#fade)"/>
  <rect x="1" y="1" width="998" height="298" rx="18" fill="none" stroke="#00FFB3" stroke-width="2" stroke-opacity="0.9"/>


  <!-- prompt -->
  <text x="500" y="112" text-anchor="middle" font-size="18" fill="#00FFB3" fill-opacity="0.8">
    manuel@tacna:~$ whoami
    <animate attributeName="fill-opacity" values="0;0.8" dur="0.6s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- nombre con glow -->
  <g filter="url(#glowSoft)">
    <text x="500" y="178" text-anchor="middle" font-size="62" font-weight="700" fill="#00FFB3" fill-opacity="0.35">MANUEL DONGO</text>
  </g>

  <!-- glitch: separacion RGB cada ~8s -->
  <g font-size="62" font-weight="700" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;0;0.85;0;0.7;0;0.5;0;0" keyTimes="0;0.86;0.87;0.885;0.9;0.915;0.93;0.945;1" dur="8s" begin="2s" repeatCount="indefinite"/>
    <text x="500" y="178" fill="#ff5f57" style="mix-blend-mode:screen">MANUEL DONGO
      <animate attributeName="x" values="500;500;492;500;508;500;494;500;500" keyTimes="0;0.86;0.87;0.885;0.9;0.915;0.93;0.945;1" dur="8s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="178" fill="#5ea0ff" style="mix-blend-mode:screen">MANUEL DONGO
      <animate attributeName="x" values="500;500;508;500;492;500;506;500;500" keyTimes="0;0.86;0.87;0.885;0.9;0.915;0.93;0.945;1" dur="8s" begin="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <g filter="url(#glow)">
    <!-- flicker neon sincronizado con el glitch -->
    <animate attributeName="opacity" values="1;1;0.25;1;0.6;1;0.35;1;1" keyTimes="0;0.86;0.87;0.885;0.9;0.915;0.93;0.945;1" dur="8s" begin="2s" repeatCount="indefinite"/>
    <text x="500" y="178" text-anchor="middle" font-size="62" font-weight="700" fill="#00FFB3">MANUEL DONGO
      <animate attributeName="fill-opacity" values="0;1" dur="0.9s" begin="0.8s" fill="freeze"/>
    </text>
  </g>

  <!-- subtítulo -->
  <text x="500" y="214" text-anchor="middle" font-size="17" fill="#FFFFFF" fill-opacity="0">
    Ingeniería de Sistemas  •  Apps &amp; Landing Pages  •  Python  •  Linux
    <animate attributeName="fill-opacity" values="0;0.95" dur="0.8s" begin="1.6s" fill="freeze"/>
  </text>

  <!-- cursor -->
  <rect x="762" y="150" width="14" height="30" fill="#00FFB3">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- línea de escaneo -->
  <rect x="-300" y="0" width="300" height="300" fill="url(#scan)" opacity="0.12">
    <animate attributeName="x" from="-300" to="1000" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- barra inferior -->
  <rect x="0" y="292" width="1000" height="8" rx="4" fill="#00FFB3" opacity="0.9"/>
</svg>
