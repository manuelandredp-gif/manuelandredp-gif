<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="'Fira Code','JetBrains Mono','Cascadia Code',Consolas,monospace">
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00FFB3" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FFB3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00FFB3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00FFB3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fondo -->
  <rect width="1000" height="300" rx="18" fill="#0d1117"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1000" height="120" fill="url(#fade)"/>
  <rect x="1" y="1" width="998" height="298" rx="18" fill="none" stroke="#00FFB3" stroke-width="2" stroke-opacity="0.9"/>

  <!-- tokens de código flotando -->
  <g font-size="14" fill="#00FFB3" fill-opacity="0.35">
    <text x="60" y="60">def build():
      <animate attributeName="y" values="60;40;60" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.15;0.45;0.15" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="820" y="80">sudo apt update
      <animate attributeName="y" values="80;100;80" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.4;0.1;0.4" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="120" y="250">git push origin main
      <animate attributeName="y" values="250;235;250" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.2;0.45;0.2" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="760" y="240">npm run build
      <animate attributeName="y" values="240;258;240" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.4;0.15;0.4" dur="6.5s" repeatCount="indefinite"/>
    </text>
    <text x="440" y="45">import this
      <animate attributeName="fill-opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="150">~$ ls -la
      <animate attributeName="fill-opacity" values="0.35;0.1;0.35" dur="5.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- prompt -->
  <text x="500" y="112" text-anchor="middle" font-size="18" fill="#00FFB3" fill-opacity="0.8">
    manuel@tacna:~$ whoami
    <animate attributeName="fill-opacity" values="0;0.8" dur="0.6s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- nombre con glow -->
  <g filter="url(#glowSoft)">
    <text x="500" y="178" text-anchor="middle" font-size="62" font-weight="700" fill="#00FFB3" fill-opacity="0.35">MANUEL DONGO</text>
  </g>
  <g filter="url(#glow)">
    <text x="500" y="178" text-anchor="middle" font-size="62" font-weight="700" fill="#00FFB3">MANUEL DONGO
      <animate attributeName="fill-opacity" values="0;1" dur="0.9s" begin="0.8s" fill="freeze"/>
    </text>
  </g>

  <!-- subtítulo -->
  <text x="500" y="214" text-anchor="middle" font-size="17" fill="#FFFFFF" fill-opacity="0">
    Ingeniería de Sistemas  •  Apps &amp; Landing Pages  •  Python  •  Linux
    <animate attributeName="fill-opacity" values="0;0.95" dur="0.8s" begin="1.6s" fill="freeze"/>
  </text>

  <!-- cursor -->
  <rect x="762" y="150" width="14" height="30" fill="#00FFB3">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- línea de escaneo -->
  <rect x="-300" y="0" width="300" height="300" fill="url(#scan)" opacity="0.12">
    <animate attributeName="x" from="-300" to="1000" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- barra inferior -->
  <rect x="0" y="292" width="1000" height="8" rx="4" fill="#00FFB3" opacity="0.9"/>
</svg>
