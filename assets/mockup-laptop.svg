<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Segoe UI',Inter,Arial,sans-serif">
  <defs>
    <clipPath id="scr"><rect x="48" y="26" width="544" height="320" rx="6"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- laptop -->
  <rect x="36" y="14" width="568" height="344" rx="16" fill="#0d1117" stroke="#00FFB3" stroke-width="2" filter="url(#sh)"/>
  <rect x="48" y="26" width="544" height="320" rx="6" fill="#0E0E0E"/>
  <rect x="0" y="358" width="640" height="14" rx="4" fill="#1a1f26"/>
  <rect x="260" y="358" width="120" height="6" rx="3" fill="#2a3139"/>
  <rect x="20" y="372" width="600" height="6" rx="3" fill="#0d1117"/>

  <g clip-path="url(#scr)">
    <!-- barra superior app -->
    <rect x="48" y="26" width="544" height="34" fill="#141414"/>
    <text x="64" y="48" font-size="12" font-weight="700" fill="#fff">🍕 Retequeños OS</text>
    <text x="186" y="48" font-size="10" fill="#888">Hub operativo · Monitor KDS Cocina</text>
    <circle cx="560" cy="43" r="4" fill="#00FFB3"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="551" y="47" text-anchor="end" font-size="9" fill="#00FFB3">EN VIVO</text>

    <!-- columnas -->
    <g font-size="10" font-weight="700">
      <rect x="60" y="72" width="166" height="22" rx="4" fill="#2a1f1f"/><text x="143" y="87" text-anchor="middle" fill="#ff8a80">NUEVOS · 2</text>
      <rect x="237" y="72" width="166" height="22" rx="4" fill="#2a2415"/><text x="320" y="87" text-anchor="middle" fill="#ffd166">EN PREPARACIÓN · 3</text>
      <rect x="414" y="72" width="166" height="22" rx="4" fill="#0f2a22"/><text x="497" y="87" text-anchor="middle" fill="#00FFB3">LISTOS · 4</text>
    </g>

    <!-- tickets estaticos -->
    <g font-size="9">
      <rect x="60" y="104" width="166" height="58" rx="6" fill="#1c1c1c" stroke="#3a2a2a"/>
      <text x="70" y="120" fill="#fff" font-weight="700">#1042 · Mesa 4</text><text x="216" y="120" text-anchor="end" fill="#ff8a80">02:14</text>
      <text x="70" y="136" fill="#bbb">2× Tequeños clásicos</text><text x="70" y="150" fill="#bbb">1× Pizza personal</text>

      <rect x="237" y="104" width="166" height="58" rx="6" fill="#1c1c1c" stroke="#3a3420"/>
      <text x="247" y="120" fill="#fff" font-weight="700">#1039 · Delivery</text><text x="393" y="120" text-anchor="end" fill="#ffd166">08:51</text>
      <text x="247" y="136" fill="#bbb">1× Promo Dúo</text><text x="247" y="150" fill="#bbb">2× Chicha 500ml</text>

      <rect x="237" y="170" width="166" height="58" rx="6" fill="#1c1c1c" stroke="#3a3420"/>
      <text x="247" y="186" fill="#fff" font-weight="700">#1040 · WhatsApp</text><text x="393" y="186" text-anchor="end" fill="#ffd166">05:30</text>
      <text x="247" y="202" fill="#bbb">6× Tequeños de lomo</text><text x="247" y="216" fill="#bbb">1× Salsa extra</text>

      <rect x="414" y="104" width="166" height="58" rx="6" fill="#1c1c1c" stroke="#1f3a30"/>
      <text x="424" y="120" fill="#fff" font-weight="700">#1037 · Mesa 2</text><text x="570" y="120" text-anchor="end" fill="#00FFB3">✓ listo</text>
      <text x="424" y="136" fill="#bbb">1× Pizza familiar</text><text x="424" y="150" fill="#bbb">2× Gaseosa</text>

      <rect x="414" y="170" width="166" height="58" rx="6" fill="#1c1c1c" stroke="#1f3a30"/>
      <text x="424" y="186" fill="#fff" font-weight="700">#1038 · Delivery</text><text x="570" y="186" text-anchor="end" fill="#00FFB3">✓ listo</text>
      <text x="424" y="202" fill="#bbb">4× Tequeños mixtos</text><text x="424" y="216" fill="#bbb">1× Promo Familiar</text>
    </g>

    <!-- ticket que viaja por las columnas -->
    <g font-size="9">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,0;177,0;177,0;354,0;354,0;0,0" keyTimes="0;0.3;0.38;0.62;0.7;0.95;1" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;0 0 1 1;0 0 1 1"/>
      <rect x="60" y="170" width="166" height="58" rx="6" fill="#222" stroke="#00FFB3" stroke-width="1.2">
        <animate attributeName="stroke" values="#ff8a80;#ff8a80;#ffd166;#ffd166;#00FFB3;#00FFB3;#ff8a80" keyTimes="0;0.3;0.38;0.62;0.7;0.95;1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <text x="70" y="186" fill="#fff" font-weight="700">#1043 · WhatsApp</text>
      <text x="216" y="186" text-anchor="end" fill="#00FFB3">00:12</text>
      <text x="70" y="202" fill="#bbb">3× Tequeños de queso</text><text x="70" y="216" fill="#bbb">1× Chicha 1L</text>
    </g>

    <!-- metricas -->
    <rect x="60" y="262" width="520" height="70" rx="8" fill="#141414"/>
    <g font-size="9" fill="#888">
      <text x="80" y="282">PEDIDOS HOY</text><text x="80" y="306" font-size="18" font-weight="700" fill="#fff">47</text>
      <text x="210" y="282">TICKET PROMEDIO</text><text x="210" y="306" font-size="18" font-weight="700" fill="#fff">S/ 32.5</text>
      <text x="360" y="282">TIEMPO COCINA</text><text x="360" y="306" font-size="18" font-weight="700" fill="#00FFB3">6:40</text>
      <text x="480" y="282">PRUEBAS E2E</text><text x="480" y="306" font-size="18" font-weight="700" fill="#00FFB3">21/21 ✓</text>
    </g>
    <text x="320" y="340" text-anchor="middle" font-size="8" fill="#666">React 18 + Vite · Node.js API REST · persistencia atómica en disco · PII enmascarada · 21 pruebas automatizadas</text>
  </g>
</svg>
